<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="112" fill="url(#rf-grad)" />

  <!-- Document Body with Shadow -->
  <g filter="url(#shadow)">
    <!-- Document Page with folded top-right corner -->
    <path d="M 148 100 
             L 300 100 
             L 364 164 
             L 364 400 
             A 12 12 0 0 1 352 412 
             L 160 412 
             A 12 12 0 0 1 148 400 
             Z" 
          fill="#ffffff" />
    
    <!-- Folded Corner Flap -->
    <path d="M 300 100 
             L 300 164 
             L 364 164 
             Z" 
          fill="#e2e8f0" />
    
    <!-- Document Text Lines -->
    <rect x="188" y="200" width="136" height="14" rx="7" fill="#cbd5e1" />
    <rect x="188" y="234" width="100" height="14" rx="7" fill="#cbd5e1" />
    <rect x="188" y="268" width="120" height="14" rx="7" fill="#cbd5e1" />

    <!-- Circular Check Badge -->
    <circle cx="330" cy="350" r="54" fill="#0284c7" />
    <circle cx="330" cy="350" r="46" fill="#22c55e" />
    
    <!-- White Checkmark -->
    <path d="M 310 350 L 324 364 L 352 334" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
